name: EPG Comprehensive Processing and Channel Analysis

on:
  schedule:
    - cron: '1 */1 * * *'    # 每小時第1分鐘執行
    - cron: '30 */1 * * *'   # 每小時第30分鐘執行
  workflow_dispatch:
    inputs:
      force_upload:
        description: '強制上傳所有文件'
        required: false
        default: 'false'

jobs:
  epg_comprehensive_processing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_USER_NAME: "github-actions[bot]"
      GIT_USER_EMAIL: "github-actions[bot]@users.noreply.github.com"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libxml2-utils xmlstarlet gzip wget curl
          echo "環境設置完成"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          # 安裝 Python 依賴
          pip install opencc beautifulsoup4 lxml
          
          # 安裝 PHP 依賴（如果存在）
          if [ -f "composer.json" ]; then
            composer install --no-dev --no-progress --no-interaction --prefer-dist --optimize-autoloader
          fi
          
          echo "依賴安裝完成"

      - name: Download external files
        id: download
        continue-on-error: true
        run: |
          echo "開始下載外部文件..."
          DOWNLOADED_FILES=""
          
          # 檢查並下載 files.json 中定義的文件
          if [ -f "files.json" ]; then
            echo "找到 files.json，開始下載..."
            
            # 使用 jq 安全地解析 JSON
            jq -r 'to_entries[] | "\(.key)|\(.value)"' files.json | while IFS='|' read -r filename url; do
              if [ -n "$filename" ] && [ -n "$url" ]; then
                echo "下載: $filename"
                
                # 使用重試機制下載
                if wget -q --retry-connrefused --waitretry=2 --timeout=30 -O "$filename" "$url"; then
                  echo "✓ 下載成功: $filename"
                  
                  # 如果是 gz 文件，嘗試解壓
                  if [[ "$filename" == *.gz ]] && [ -f "$filename" ]; then
                    echo "解壓: $filename"
                    if gunzip -f -k "$filename" 2>/dev/null; then
                      extracted_file="${filename%.gz}"
                      if [ -f "$extracted_file" ]; then
                        echo "✓ 解壓成功: $extracted_file"
                        DOWNLOADED_FILES="${DOWNLOADED_FILES}${extracted_file},"
                      fi
                    else
                      echo "⚠️ 解壓失敗或文件已解壓: $filename"
                    fi
                  fi
                  
                  DOWNLOADED_FILES="${DOWNLOADED_FILES}${filename},"
                else
                  echo "⚠️ 下載失敗: $filename"
                fi
              fi
            done
          else
            echo "files.json 不存在，跳過下載"
          fi
          
          # 移除末尾的逗號並輸出
          DOWNLOADED_FILES=${DOWNLOADED_FILES%,}
          echo "downloaded_files=${DOWNLOADED_FILES}" >> $GITHUB_OUTPUT
          echo "下載完成"

      - name: Process Guangdong EPG
        id: guangdong_epg
        continue-on-error: true
        run: |
          echo "處理廣東EPG..."
          EPG_FILE="epgguangdong.xml"
          EPG_GZ="${EPG_FILE}.gz"
          
          # 檢查是否已有文件
          if [ -f "$EPG_FILE" ] && [ -s "$EPG_FILE" ]; then
            echo "使用現有文件: $EPG_FILE"
          elif [ -f "$EPG_GZ" ] && [ -s "$EPG_GZ" ]; then
            echo "解壓現有文件: $EPG_GZ"
            gunzip -f -k "$EPG_GZ"
          else
            echo "下載廣東EPG..."
            EPG_URL="https://raw.githubusercontent.com/litiande03/epg/refs/heads/master/pl.xml.gz"
            
            if curl -L --retry 3 --max-time 30 -o "$EPG_GZ" "$EPG_URL"; then
              if gunzip -f -k "$EPG_GZ"; then
                echo "✓ 下載並解壓成功"
              else
                echo "⚠️ 解壓失敗"
              fi
            else
              echo "❌ 下載失敗"
              echo "guangdong_processed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # 處理EPG文件
          if [ -f "$EPG_FILE" ] && [ -s "$EPG_FILE" ]; then
            # 驗證XML格式
            if xmlstarlet val "$EPG_FILE" >/dev/null 2>&1; then
              echo "✓ XML格式有效"
              
              # 如果有轉換腳本就執行
              if [ -f "convert.py" ]; then
                echo "執行轉換腳本..."
                if python convert.py "$EPG_FILE"; then
                  echo "✓ 轉換成功"
                else
                  echo "⚠️ 轉換失敗"
                fi
              fi
              
              # 重新生成壓縮文件
              echo "生成壓縮文件..."
              gzip -c -f "$EPG_FILE" > "$EPG_GZ"
              
              echo "guangdong_processed=true" >> $GITHUB_OUTPUT
            else
              echo "❌ XML格式無效"
              echo "guangdong_processed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ EPG文件不存在或為空"
            echo "guangdong_processed=false" >> $GITHUB_OUTPUT
          fi

      - name: Find and run PHP scripts
        id: php_scripts
        continue-on-error: true
        run: |
          echo "尋找PHP腳本..."
          
          # 查找所有PHP腳本
          PHP_SCRIPTS=()
          while IFS= read -r -d '' script; do
            # 排除composer和vendor目錄中的文件
            if [[ ! "$script" =~ /vendor/ ]] && [[ ! "$script" =~ composer\.php$ ]]; then
              PHP_SCRIPTS+=("$script")
            fi
          done < <(find . -name "*.php" -type f -print0 2>/dev/null || true)
          
          if [ ${#PHP_SCRIPTS[@]} -eq 0 ]; then
            echo "未找到PHP腳本"
            echo "php_scripts_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "找到 ${#PHP_SCRIPTS[@]} 個PHP腳本:"
          printf '  - %s\n' "${PHP_SCRIPTS[@]}"
          
          # 創建日誌目錄
          mkdir -p logs/php
          
          # 執行每個腳本
          SUCCESS_COUNT=0
          FAILED_SCRIPTS=()
          
          for script in "${PHP_SCRIPTS[@]}"; do
            SCRIPT_NAME=$(basename "$script")
            LOG_FILE="logs/php/${SCRIPT_NAME%.php}.log"
            
            echo "執行: $script"
            START_TIME=$(date +%s)
            
            if php "$script" > "$LOG_FILE" 2>&1; then
              END_TIME=$(date +%s)
              DURATION=$((END_TIME - START_TIME))
              echo "  ✓ 成功 (${DURATION}秒)"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "  ❌ 失敗"
              FAILED_SCRIPTS+=("$script")
            fi
          done
          
          echo "php_scripts_count=${#PHP_SCRIPTS[@]}" >> $GITHUB_OUTPUT
          echo "php_scripts_success=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
          
          if [ ${#FAILED_SCRIPTS[@]} -gt 0 ]; then
            echo "failed_scripts=${FAILED_SCRIPTS[*]}" >> $GITHUB_OUTPUT
            echo "⚠️ 有 ${#FAILED_SCRIPTS[@]} 個腳本執行失敗"
          fi

      - name: Process generated XML files
        id: process_xml
        run: |
          echo "處理生成的XML文件..."
          
          # 查找所有XML文件
          XML_FILES=()
          while IFS= read -r -d '' file; do
            # 排除特定目錄
            if [[ ! "$file" =~ /vendor/ ]] && [[ ! "$file" =~ /logs/ ]]; then
              XML_FILES+=("$file")
            fi
          done < <(find . -name "*.xml" -type f -print0 2>/dev/null || true)
          
          if [ ${#XML_FILES[@]} -eq 0 ]; then
            echo "未找到XML文件"
            echo "xml_files_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "找到 ${#XML_FILES[@]} 個XML文件:"
          
          VALID_FILES=()
          INVALID_FILES=()
          
          for xml_file in "${XML_FILES[@]}"; do
            FILE_SIZE=$(stat -c%s "$xml_file" 2>/dev/null || wc -c < "$xml_file")
            
            # 驗證XML格式
            if xmlstarlet val "$xml_file" >/dev/null 2>&1; then
              echo "  ✓ $xml_file (${FILE_SIZE} bytes)"
              VALID_FILES+=("$xml_file")
              
              # 生成壓縮版本
              if [[ ! "$xml_file" == *.gz ]]; then
                GZ_FILE="${xml_file}.gz"
                gzip -c -f "$xml_file" > "$GZ_FILE"
                echo "    生成壓縮文件: $GZ_FILE"
              fi
            else
              echo "  ❌ $xml_file (無效XML)"
              INVALID_FILES+=("$xml_file")
            fi
          done
          
          # 輸出結果
          if [ ${#VALID_FILES[@]} -gt 0 ]; then
            VALID_LIST=$(IFS=,; echo "${VALID_FILES[*]}")
            echo "valid_xml_files=$VALID_LIST" >> $GITHUB_OUTPUT
          fi
          
          echo "xml_files_count=${#XML_FILES[@]}" >> $GITHUB_OUTPUT
          echo "valid_xml_count=${#VALID_FILES[@]}" >> $GITHUB_OUTPUT
          
          if [ ${#INVALID_FILES[@]} -gt 0 ]; then
            echo "⚠️ 有 ${#INVALID_FILES[@]} 個無效XML文件"
          fi

      - name: Convert Chinese encoding
        id: convert_chinese
        continue-on-error: true
        run: |
          echo "處理中文編碼轉換..."
          
          # 尋找可能的中文EPG文件
          SOURCE_FILES=()
          for file in "epgziyong.xml" "swepg.xml" "twepg.xml" "epgguangdong.xml"; do
            if [ -f "$file" ] && [ -s "$file" ]; then
              SOURCE_FILES+=("$file")
            fi
          done
          
          if [ ${#SOURCE_FILES[@]} -eq 0 ]; then
            echo "未找到源文件，跳過轉換"
            echo "converted_files=none" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          CONVERTED_FILES=()
          
          for source_file in "${SOURCE_FILES[@]}"; do
            echo "處理: $source_file"
            
            # 繁體轉簡體
            SIMPLIFIED_FILE="swepg_${source_file%.xml}.xml"
            python3 -c "
from opencc import OpenCC
import sys

try:
    cc = OpenCC('t2s')
    with open('$source_file', 'r', encoding='utf-8') as f:
        content = f.read()
    simplified = cc.convert(content)
    with open('$SIMPLIFIED_FILE', 'w', encoding='utf-8') as f:
        f.write(simplified)
    print(f'  生成簡體: $SIMPLIFIED_FILE')
    
    # 生成壓縮文件
    import gzip
    with open('$SIMPLIFIED_FILE', 'rb') as f_in:
        with gzip.open('${SIMPLIFIED_FILE}.gz', 'wb') as f_out:
            f_out.writelines(f_in)
    print(f'  生成壓縮: ${SIMPLIFIED_FILE}.gz')
    
    CONVERTED_FILES+=('$SIMPLIFIED_FILE' '${SIMPLIFIED_FILE}.gz')
except Exception as e:
    print(f'  轉換失敗: {e}')
" || true
            
            # 簡體轉繁體
            TRADITIONAL_FILE="twepg_${source_file%.xml}.xml"
            python3 -c "
from opencc import OpenCC
import sys

try:
    cc = OpenCC('s2t')
    with open('$source_file', 'r', encoding='utf-8') as f:
        content = f.read()
    traditional = cc.convert(content)
    with open('$TRADITIONAL_FILE', 'w', encoding='utf-8') as f:
        f.write(traditional)
    print(f'  生成繁體: $TRADITIONAL_FILE')
    
    # 生成壓縮文件
    import gzip
    with open('$TRADITIONAL_FILE', 'rb') as f_in:
        with gzip.open('${TRADITIONAL_FILE}.gz', 'wb') as f_out:
            f_out.writelines(f_in)
    print(f'  生成壓縮: ${TRADITIONAL_FILE}.gz')
    
    CONVERTED_FILES+=('$TRADITIONAL_FILE' '${TRADITIONAL_FILE}.gz')
except Exception as e:
    print(f'  轉換失敗: {e}')
" || true
          done
          
          # 輸出結果
          if [ ${#CONVERTED_FILES[@]} -gt 0 ]; then
            CONVERTED_LIST=$(IFS=,; echo "${CONVERTED_FILES[*]}")
            echo "converted_files=$CONVERTED_LIST" >> $GITHUB_OUTPUT
            echo "✓ 生成 ${#CONVERTED_FILES[@]} 個轉換文件"
          else
            echo "converted_files=none" >> $GITHUB_OUTPUT
          fi

      - name: Extract channel information
        id: extract_channels
        run: |
          echo "提取頻道信息..."
          
          # 尋找EPG文件
          EPG_FILES=()
          for pattern in "*.xml" "!*.gz"; do
            while IFS= read -r -d '' file; do
              if [[ ! "$file" =~ /vendor/ ]] && [[ ! "$file" =~ /logs/ ]] && [[ ! "$file" == *.gz ]]; then
                EPG_FILES+=("$file")
              fi
            done < <(find . -name "$pattern" -type f -print0 2>/dev/null || true)
          done
          
          if [ ${#EPG_FILES[@]} -eq 0 ]; then
            echo "未找到EPG文件"
            echo "channels_extracted=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          EXTRACTED_FILES=()
          
          for epg_file in "${EPG_FILES[@]}"; do
            echo "處理: $epg_file"
            
            # 提取文件名（不含擴展名）
            BASE_NAME=$(basename "$epg_file" .xml)
            OUTPUT_FILE="${BASE_NAME}_channels.txt"
            
            # 使用 Python 提取頻道名稱
            python3 -c "
import xml.etree.ElementTree as ET
import re

try:
    tree = ET.parse('$epg_file')
    root = tree.getroot()
    
    # 處理命名空間
    ns = {}
    if root.tag.startswith('{'):
        ns_uri = root.tag.split('}')[0][1:]
        ns = {'ns': ns_uri}
    
    channels = []
    seen = set()
    
    # 查找所有 channel 元素
    channel_xpath = './/ns:channel' if ns else './/channel'
    
    for elem in root.findall(channel_xpath, ns):
        # 獲取頻道名稱
        name = elem.get('display-name')
        if not name:
            name_elem = elem.find('ns:display-name' if ns else 'display-name', ns)
            if name_elem is not None and name_elem.text:
                name = name_elem.text.strip()
        
        # 如果還沒有找到，嘗試其他屬性
        if not name:
            name = elem.get('id', '').strip()
        
        if name and name not in seen:
            seen.add(name)
            channels.append(name)
    
    # 寫入文件
    if channels:
        with open('$OUTPUT_FILE', 'w', encoding='utf-8') as f:
            f.write('\n'.join(sorted(channels)))
        print(f'  提取 {len(channels)} 個頻道到 $OUTPUT_FILE')
        EXTRACTED_FILES+=('$OUTPUT_FILE')
    else:
        print(f'  未找到頻道信息')
        
except Exception as e:
    print(f'  處理錯誤: {e}')
"
          done
          
          if [ ${#EXTRACTED_FILES[@]} -gt 0 ]; then
            echo "channels_extracted=true" >> $GITHUB_OUTPUT
            echo "extracted_files=${EXTRACTED_FILES[*]}" >> $GITHUB_OUTPUT
            echo "✓ 提取完成"
          else
            echo "channels_extracted=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare for commit
        id: prepare_commit
        run: |
          echo "準備提交..."
          
          # 收集所有生成的文件
          ALL_FILES=()
          
          # 添加XML文件
          if [ -n "${{ steps.process_xml.outputs.valid_xml_files }}" ]; then
            IFS=',' read -ra XML_FILES <<< "${{ steps.process_xml.outputs.valid_xml_files }}"
            for file in "${XML_FILES[@]}"; do
              if [ -f "$file" ]; then
                ALL_FILES+=("$file")
              fi
              # 添加壓縮版本
              GZ_FILE="${file}.gz"
              if [ -f "$GZ_FILE" ]; then
                ALL_FILES+=("$GZ_FILE")
              fi
            done
          fi
          
          # 添加轉換文件
          if [ -n "${{ steps.convert_chinese.outputs.converted_files }}" ] && [ "${{ steps.convert_chinese.outputs.converted_files }}" != "none" ]; then
            IFS=',' read -ra CONVERTED_FILES <<< "${{ steps.convert_chinese.outputs.converted_files }}"
            for file in "${CONVERTED_FILES[@]}"; do
              if [ -f "$file" ]; then
                ALL_FILES+=("$file")
              fi
            done
          fi
          
          # 添加頻道列表文件
          if [ -n "${{ steps.extract_channels.outputs.extracted_files }}" ]; then
            IFS=' ' read -ra CHANNEL_FILES <<< "${{ steps.extract_channels.outputs.extracted_files }}"
            for file in "${CHANNEL_FILES[@]}"; do
              if [ -f "$file" ]; then
                ALL_FILES+=("$file")
              fi
            done
          fi
          
          # 添加日誌文件
          if [ -d "logs" ]; then
            ALL_FILES+=("logs/")
          fi
          
          # 輸出文件列表
          if [ ${#ALL_FILES[@]} -gt 0 ]; then
            echo "將提交 ${#ALL_FILES[@]} 個文件:"
            printf '  - %s\n' "${ALL_FILES[@]}"
            
            # 保存到環境變量
            FILES_LIST=$(printf "%s\n" "${ALL_FILES[@]}")
            echo "files_to_commit<<EOF" >> $GITHUB_OUTPUT
            echo "$FILES_LIST" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "沒有文件需要提交"
            echo "files_to_commit=" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.prepare_commit.outputs.files_to_commit != ''
        run: |
          echo "提交更改..."
          
          # 配置 Git
          git config --local user.name "$GIT_USER_NAME"
          git config --local user.email "$GIT_USER_EMAIL"
          
          # 更新本地分支
          git pull origin ${{ github.ref_name }} --rebase --autostash || echo "拉取失敗，繼續提交"
          
          # 添加文件
          echo "${{ steps.prepare_commit.outputs.files_to_commit }}" | while IFS= read -r file; do
            if [ -n "$file" ] && [ -e "$file" ]; then
              git add "$file"
              echo "添加: $file"
            fi
          done
          
          # 檢查是否有更改
          if git diff --cached --quiet; then
            echo "沒有更改需要提交"
            exit 0
          fi
          
          # 創提交信息
          COMMIT_MESSAGE="🚀 自動更新 EPG 數據 $(date '+%Y-%m-%d %H:%M:%S')"
          
          # 添加統計信息
          if [ -n "${{ steps.php_scripts.outputs.php_scripts_count }}" ]; then
            COMMIT_MESSAGE+=" | PHP腳本: ${{ steps.php_scripts.outputs.php_scripts_success }}/${{ steps.php_scripts.outputs.php_scripts_count }}"
          fi
          
          if [ -n "${{ steps.process_xml.outputs.valid_xml_count }}" ]; then
            COMMIT_MESSAGE+=" | XML文件: ${{ steps.process_xml.outputs.valid_xml_count }}"
          fi
          
          if [ "${{ steps.extract_channels.outputs.channels_extracted }}" = "true" ]; then
            COMMIT_MESSAGE+=" | 頻道已提取"
          fi
          
          # 提交
          git commit -m "$COMMIT_MESSAGE"
          
          # 推送（最多重試3次）
          for i in {1..3}; do
            echo "推送嘗試 #$i"
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✓ 推送成功"
              break
            else
              echo "推送失敗，重試..."
              sleep 2
              git pull origin ${{ github.ref_name }} --rebase
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epg-artifacts-${{ github.run_id }}
          path: |
            logs/
            *.xml
            *.xml.gz
            *_channels.txt
            *.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate summary
        if: always()
        run: |
          echo "# 📊 EPG 處理總結" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 執行狀態" >> $GITHUB_STEP_SUMMARY
          echo "- **工作流**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **運行時間**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 處理結果" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.php_scripts.outputs.php_scripts_count }}" ]; then
            echo "- **PHP腳本**: ${{ steps.php_scripts.outputs.php_scripts_success || 0 }}/${{ steps.php_scripts.outputs.php_scripts_count || 0 }} 成功" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -n "${{ steps.process_xml.outputs.valid_xml_count }}" ]; then
            echo "- **有效XML文件**: ${{ steps.process_xml.outputs.valid_xml_count || 0 }} 個" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.guangdong_epg.outputs.guangdong_processed }}" = "true" ]; then
            echo "- **廣東EPG**: 處理成功" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.extract_channels.outputs.channels_extracted }}" = "true" ]; then
            echo "- **頻道提取**: 完成" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.convert_chinese.outputs.converted_files }}" != "none" ]; then
            echo "- **中文轉換**: 完成" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 詳細日誌" >> $GITHUB_STEP_SUMMARY
          echo "查看完整日誌: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  analyze_and_report:
    needs: epg_comprehensive_processing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install analysis dependencies
        run: |
          pip install xmltodict pytz tqdm
          
      - name: Run EPG analysis
        id: analysis
        continue-on-error: true
        run: |
          echo "開始EPG分析..."
          python3 <<'EOF'
          # 簡化的分析腳本
          import os
          import json
          from datetime import datetime
          
          # 查找XML文件
          xml_files = [f for f in os.listdir('.') if f.endswith('.xml') and not f.endswith('.gz')]
          
          if not xml_files:
              print("未找到XML文件")
              exit(0)
          
          analysis_results = {
              'timestamp': datetime.now().isoformat(),
              'files_analyzed': len(xml_files),
              'details': []
          }
          
          for xml_file in xml_files[:5]:  # 只分析前5個文件
              try:
                  import subprocess
                  result = subprocess.run(
                      ['xmlstarlet', 'val', xml_file],
                      capture_output=True,
                      text=True
                  )
                  
                  file_size = os.path.getsize(xml_file)
                  is_valid = result.returncode == 0
                  
                  analysis_results['details'].append({
                      'file': xml_file,
                      'size_bytes': file_size,
                      'size_mb': round(file_size / (1024 * 1024), 2),
                      'valid': is_valid
                  })
                  
                  status = "✓" if is_valid else "✗"
                  print(f"{status} {xml_file}: {file_size:,} bytes")
                  
              except Exception as e:
                  print(f"❌ 分析 {xml_file} 時出錯: {e}")
          
          # 保存分析結果
          with open('epg_analysis.json', 'w', encoding='utf-8') as f:
              json.dump(analysis_results, f, ensure_ascii=False, indent=2)
          
          print(f"分析完成，結果保存到 epg_analysis.json")
          EOF
          
      - name: Generate report
        run: |
          echo "# 📈 EPG 分析報告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**生成時間**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "epg_analysis.json" ]; then
            echo "## 文件分析" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| 文件 | 大小 | 狀態 |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
            
            jq -r '.details[] | "| \(.file) | \(.size_mb) MB | \(if .valid then "✅ 有效" else "❌ 無效" end) |"' epg_analysis.json >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 查看數據" >> $GITHUB_STEP_SUMMARY
          echo "- 原始數據: [GitHub Repository](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "- 處理日誌: [本次運行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
