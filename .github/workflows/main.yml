name: DUPCLITE FILES Generate EPG XML Files2

on:
  schedule:
    - cron: '5 */1 * * *'   # 每小时第5分钟执行
  workflow_dispatch:

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 重要：允许 git push

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Install Composer dependencies (if any)
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --no-progress --no-interaction --prefer-dist
          else
            echo "No composer.json found, skipping dependency installation."
          fi

      - name: Install xmllint (for XML validation)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Check PHP scripts exist
        id: check_scripts
        run: |
          echo "检查PHP脚本文件..."
          declare -a scripts=("epggen2.php" "epgofiii.php" "epgkai1.php" "epgdubaione.php" "epgnewshanghai.php" "epgnewhebei.php" "epgnewguangdong.php" "epgziyong.php")
          existing_scripts=()
          
          for script in "${scripts[@]}"; do
            if [ -f "$script" ]; then
              echo "✓ 找到文件: $script"
              existing_scripts+=("$script")
            else
              echo "✗ 文件不存在: $script"
            fi
          done
          
          if [ ${#existing_scripts[@]} -eq 0 ]; then
            echo "错误: 没有找到任何PHP脚本文件"
            exit 1
          fi
          
          # 修复：使用正确的方式输出数组
          scripts_list=$(IFS=,; echo "${existing_scripts[*]}")
          echo "existing_scripts=$scripts_list" >> $GITHUB_OUTPUT

      - name: Run PHP scripts to generate XML files
        run: |
          IFS=',' read -ra scripts <<< "${{ steps.check_scripts.outputs.existing_scripts }}"
          mkdir -p logs
          
          for script in "${scripts[@]}"; do
            echo "========================================="
            echo "正在运行: $script"
            start_time=$(date +%s)
            
            if php "$script" > "logs/${script%.php}.log" 2>&1; then
              end_time=$(date +%s)
              duration=$((end_time - start_time))
              echo "✓ $script 执行成功 (耗时: ${duration}秒)"
            else
              echo "✗ $script 执行失败！请查看日志"
              exit 1   # 任一脚本失败就终止工作流
            fi
            echo "========================================="
          done

      - name: Check generated XML files
        id: check_xml
        run: |
          declare -a expected_xml=("epgofiii.xml" "epgkai1.xml" "epgdubaione.xml" "epgnewshanghai.xml" "epgnewhebei.xml" "epgnewguangdong.xml")
          generated_files=()
          
          echo "检查生成的XML文件..."
          for xml_file in "${expected_xml[@]}"; do
            if [ -f "$xml_file" ]; then
              filesize=$(stat -c%s "$xml_file" 2>/dev/null || wc -c < "$xml_file" | awk '{print $1}')
              echo "✓ 生成文件: $xml_file (大小: $filesize bytes)"
              generated_files+=("$xml_file")
              
              # XML 格式验证
              if xmllint --noout "$xml_file" 2>/dev/null; then
                echo "  XML格式验证通过"
              else
                echo "  XML格式验证失败！"
                exit 1
              fi
            else
              echo "✗ 未生成文件: $xml_file"
            fi
          done
          
          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "错误: 没有生成任何XML文件"
            exit 1
          fi
          
          # 修复：使用正确的方式输出数组
          xml_list=$(IFS=,; echo "${generated_files[*]}")
          echo "generated_xml=$xml_list" >> $GITHUB_OUTPUT
          echo "生成 ${#generated_files[@]} 个XML文件"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push XML files
        if: steps.check_xml.outputs.generated_xml != ''
        run: |
          IFS=',' read -ra xml_files <<< "${{ steps.check_xml.outputs.generated_xml }}"
          
          git add "${xml_files[@]}"
          git add logs/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "没有文件发生变化，跳过提交"
            exit 0
          fi
          
          echo "检测到文件变化，正在提交..."
          commit_message="Auto update EPG $(date '+%Y-%m-%d %H:%M:%S')"
          commit_message+=" | Files: ${{ steps.check_xml.outputs.generated_xml }}"
          
          git commit -m "$commit_message"
          git push origin HEAD:${{ github.ref }}

          echo "已成功推送更新"

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epg-generation-logs-${{ github.run_number }}
          path: |
            logs/
            *.log
          retention-days: 7

      - name: Workflow Summary
        if: always()
        run: |
          echo "=== EPG 生成任务总结 ==="
          echo "状态: ${{ job.status }}"
          echo "生成的XML: ${{ steps.check_xml.outputs.generated_xml || '无' }}"
          echo "执行的脚本: ${{ steps.check_scripts.outputs.existing_scripts }}"
          echo "查看日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
