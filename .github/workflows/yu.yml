name: Extract and Update M3U Playlist

on:
  workflow_dispatch:  # 允许手动触发
  schedule:
    # 每天UTC时间00:00和12:00各运行一次（北京时间08:00和20:00）
    - cron: '0 0,12 * * *'
  push:
    paths:
      - '.github/workflows/extract-m3u.yml'

jobs:
  extract-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Extract M3U8 links and generate playlist
      run: |
        # 安装依赖
        pip install requests beautifulsoup4 lxml
        
        # 创建Python脚本
        cat > extract_m3u8.py << 'EOF'
        import requests
        import re
        import sys
        from bs4 import BeautifulSoup
        from urllib.parse import urljoin
        
        def extract_m3u8_links(url):
            try:
                headers = {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                }
                response = requests.get(url, headers=headers, timeout=30)
                response.raise_for_status()
                
                content = response.text
                
                # 方法1: 直接查找.m3u8链接
                m3u8_links = re.findall(r'https?://[^\s"\']+\.m3u8', content)
                
                # 方法2: 如果内容中有base64编码或者其他格式
                if not m3u8_links:
                    # 尝试从JavaScript变量中提取
                    js_matches = re.findall(r'["\'](https?://[^"\']+\.m3u8)["\']', content)
                    m3u8_links.extend(js_matches)
                
                # 方法3: 解析HTML中的链接
                soup = BeautifulSoup(content, 'html.parser')
                for a_tag in soup.find_all('a', href=True):
                    href = a_tag['href']
                    if href.endswith('.m3u8'):
                        full_url = urljoin(url, href)
                        m3u8_links.append(full_url)
                
                # 去重
                m3u8_links = list(set(m3u8_links))
                
                return m3u8_links
                
            except Exception as e:
                print(f"Error extracting m3u8 links: {e}")
                return []
        
        def generate_m3u_playlist(links):
            playlist = "#EXTM3U\n"
            
            for idx, link in enumerate(links, 1):
                # 尝试从URL中提取频道名称
                channel_name = f"Channel_{idx}"
                
                # 从URL中提取可能的频道名
                if '/live/' in link:
                    match = re.search(r'/live/([^/\.]+)', link)
                    if match:
                        channel_name = match.group(1).replace('_', ' ').title()
                
                playlist += f"#EXTINF:-1 tvg-id=\"channel{idx}\" tvg-name=\"{channel_name}\", {channel_name}\n"
                playlist += f"{link}\n\n"
            
            return playlist
        
        if __name__ == "__main__":
            target_url = "https://litv.msbot.dpdns.org/test.php"
            
            print(f"Fetching content from: {target_url}")
            m3u8_links = extract_m3u8_links(target_url)
            
            print(f"Found {len(m3u8_links)} m3u8 links:")
            for link in m3u8_links:
                print(f"  - {link}")
            
            if m3u8_links:
                playlist = generate_m3u_playlist(m3u8_links)
                
                with open('live.m3u', 'w', encoding='utf-8') as f:
                    f.write(playlist)
                print("Playlist generated: live.m3u")
            else:
                print("No m3u8 links found!")
                sys.exit(1)
        EOF
        
        # 运行Python脚本
        python extract_m3u8.py
        
    - name: Create alternative extraction method (using curl)
      run: |
        # 备用方法：使用curl和grep直接提取
        curl -s "https://litv.msbot.dpdns.org/test.php" \
        | grep -o 'https\?://[^"<> ]*\.m3u8' \
        | sort -u > m3u8_links.txt || true
        
        # 如果有找到链接，生成m3u文件
        if [ -s m3u8_links.txt ]; then
          echo "#EXTM3U" > temp.m3u
          counter=1
          while IFS= read -r line; do
            echo "#EXTINF:-1 tvg-id=\"channel$counter\", Channel $counter" >> temp.m3u
            echo "$line" >> temp.m3u
            echo "" >> temp.m3u
            counter=$((counter + 1))
          done < m3u8_links.txt
          
          # 如果Python方法失败，使用这个
          if [ ! -f "live.m3u" ] || [ ! -s "live.m3u" ]; then
            mv temp.m3u live.m3u
          fi
        fi
        
    - name: Validate generated file
      run: |
        if [ ! -f "live.m3u" ] || [ ! -s "live.m3u" ]; then
          echo "Error: live.m3u file not generated or is empty!"
          exit 1
        fi
        
        echo "Generated live.m3u content:"
        head -20 live.m3u
        echo "..."
        echo "Total lines: $(wc -l < live.m3u)"
        
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 检查是否有变化
        if [ -n "$(git status --porcelain)" ]; then
          git add live.m3u
          git commit -m "Update live.m3u playlist - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
          echo "Changes pushed to repository"
        else
          echo "No changes to commit"
        fi
