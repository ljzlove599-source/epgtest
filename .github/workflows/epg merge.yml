name: EPG Comprehensive and Merging Processing

on:
  schedule:
    - cron: '1 */1 * * *'   # 每小时第1分钟开始执行
  workflow_dispatch:

jobs:
  epg_comprehensive_processing:
    runs-on: ubuntu-latest
   
    steps:
      # 第一阶段：环境准备和代码检出
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up environments
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libxml2-utils gzip
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          # PHP依赖
          if [ -f "composer.json" ]; then
            composer install --no-dev --no-progress --no-interaction --prefer-dist
          fi
          
          # Python依赖
          pip install opencc
          
          echo "所有依赖安装完成"
      
      # 第四阶段：PHP EPG生成
      - name: Check PHP scripts exist
        id: check_scripts
        run: |
          echo "检查PHP脚本文件..."
          declare -a scripts=( "epgziyongtr.php")
          existing_scripts=()
          
          for script in "${scripts[@]}"; do
            if [ -f "$script" ]; then
              echo "✓ 找到文件: $script"
              existing_scripts+=("$script")
            else
              echo "✗ 文件不存在: $script"
            fi
          done
          
          if [ ${#existing_scripts[@]} -eq 0 ]; then
            echo "警告: 没有找到任何PHP脚本文件，跳过EPG生成"
            echo "existing_scripts=none" >> $GITHUB_OUTPUT
          else
            scripts_list=$(IFS=,; echo "${existing_scripts[*]}")
            echo "existing_scripts=$scripts_list" >> $GITHUB_OUTPUT
          fi
      - name: Run PHP scripts to generate XML files
        if: steps.check_scripts.outputs.existing_scripts != 'none'
        run: |
          IFS=',' read -ra scripts <<< "${{ steps.check_scripts.outputs.existing_scripts }}"
          mkdir -p logs
          
          for script in "${scripts[@]}"; do
            echo "========================================="
            echo "正在运行: $script"
            start_time=$(date +%s)
            
            if php "$script" > "logs/${script%.php}.log" 2>&1; then
              end_time=$(date +%s)
              duration=$((end_time - start_time))
              echo "✓ $script 执行成功 (耗时: ${duration}秒)"
            else
              echo "✗ $script 执行失败！请查看日志"
              exit 1
            fi
            echo "========================================="
          done
      - name: Check generated XML files
        id: check_xml
        run: |
          declare -a expected_xml=("epgziyongtr.xml")
          generated_files=()
          
          echo "检查生成的XML文件..."
          for xml_file in "${expected_xml[@]}"; do
            if [ -f "$xml_file" ]; then
              filesize=$(stat -c%s "$xml_file" 2>/dev/null || wc -c < "$xml_file" | awk '{print $1}')
              echo "✓ 生成文件: $xml_file (大小: $filesize bytes)"
              generated_files+=("$xml_file")
              
              # 对XML文件进行格式验证（跳过.gz文件）
              if [[ "$xml_file" != *.gz ]]; then
                if xmllint --noout "$xml_file" 2>/dev/null; then
                  echo "  XML格式验证通过"
                else
                  echo "  XML格式验证失败！"
                  exit 1
                fi
              fi
            else
              echo "✗ 未生成文件: $xml_file"
            fi
          done
          
          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "警告: 没有生成任何XML文件"
            echo "generated_xml=none" >> $GITHUB_OUTPUT
          else
            xml_list=$(IFS=,; echo "${generated_files[*]}")
            echo "generated_xml=$xml_list" >> $GITHUB_OUTPUT
            echo "生成 ${#generated_files[@]} 个XML文件"
          fi
      # 第五阶段：繁简转换（已修改）
      - name: Convert to Simplified and Traditional Chinese
        id: convert_chinese
        run: |
          echo "开始繁简转换..."
          
          # 转换主文件 epgziyongtr.xml
          if [ -f "epgziyongtr.xml" ]; then
            echo "转换 epgziyongtr.xml..."
            python - <<'EOF'
          from opencc import OpenCC
          import os, gzip
          
          def convert_epg_file(input_file, simplified_prefix, traditional_prefix):
              if not os.path.exists(input_file):
                  return False
              
              # 初始化两个转换器
              cc_t2s = OpenCC('t2s')  # 繁 → 简
              cc_s2t = OpenCC('s2t')  # 简 → 繁
              
              with open(input_file, "r", encoding="utf-8") as f:
                  text = f.read()
              
              # --- 繁转简 ---
              simplified = cc_t2s.convert(text)
              simplified_file = f"{simplified_prefix}.xml"
              with open(simplified_file, "w", encoding="utf-8") as f:
                  f.write(simplified)
              with open(simplified_file, "rb") as f_in, gzip.open(f"{simplified_file}.gz", "wb") as f_out:
                  f_out.writelines(f_in)
              print(f"✅ 已生成 {simplified_file} 和 {simplified_file}.gz（繁→简）")
              
              # --- 简转繁 ---
              traditional = cc_s2t.convert(text)
              traditional_file = f"{traditional_prefix}.xml"
              with open(traditional_file, "w", encoding="utf-8") as f:
                  f.write(traditional)
              with open(traditional_file, "rb") as f_in, gzip.open(f"{traditional_file}.gz", "wb") as f_out:
                  f_out.writelines(f_in)
              print(f"✅ 已生成 {traditional_file} 和 {traditional_file}.gz（简→繁）")
              
              return True
          
          # 转换主文件
          print("=== 转换 epgziyongtr.xml ===")
          convert_epg_file("epgziyong.xml", "swepg", "twepg")
          
          # 转换原始文件
          print("=== 转换 epgziyongtr.xml ===")
          convert_epg_file("epgziyongtr.xml", "swepgorginal", "twepgorginal")
          
          EOF
            
            # 设置输出变量
            converted_files_list=""
            
            # 检查生成的文件并添加到列表
            for file in "swepgtr.xml" "swepgtr.xml.gz" "twepgtr.xml" "twepgtr.xml.gz" ; do
              if [ -f "$file" ]; then
                if [ -z "$converted_files_list" ]; then
                  converted_files_list="$file"
                else
                  converted_files_list="$converted_files_list,$file"
                fi
              fi
            done
            
            if [ -n "$converted_files_list" ]; then
              echo "converted_files=$converted_files_list" >> $GITHUB_OUTPUT
              echo "生成的转换文件: $converted_files_list"
            else
              echo "converted_files=none" >> $GITHUB_OUTPUT
            fi
            
          else
            echo "epgziyongtr.xml 不存在，跳过繁简转换"
            echo "converted_files=none" >> $GITHUB_OUTPUT
          fi
      
          # 添加生成的XML文件（包括epgguangdong.xml和epgguangdong.xml.gz）
          if [ "${{ steps.check_xml.outputs.generated_xml }}" != "none" ]; then
            IFS=',' read -ra xml_files <<< "${{ steps.check_xml.outputs.generated_xml }}"
            for xml_file in "${xml_files[@]}"; do
              if [ -f "$xml_file" ]; then
                git add "$xml_file"
                echo "添加XML文件: $xml_file"
                files_changed=1
              fi
            done
          fi
          
          
          
          
          
          # 添加日志文件
          git add logs/ 2>/dev/null || true
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "没有文件发生变化，跳过提交"
            exit 0
          fi
          
          # 提交并推送
          echo "检测到文件变化，正在提交..."
          commit_message="Auto update EPG $(date '+%Y-%m-%d %H:%M:%S')"
          
          if [ "${{ steps.check_xml.outputs.generated_xml }}" != "none" ]; then
            commit_message+=" | Generated: ${{ steps.check_xml.outputs.generated_xml }}"
          fi
          
          if [ "${{ steps.convert_chinese.outputs.converted_files }}" != "none" ]; then
            commit_message+=" | Converted: ${{ steps.convert_chinese.outputs.converted_files }}"
          fi
          
          if [ "${{ steps.extract_channels.outputs.channels_extracted }}" == "true" ]; then
            commit_message+=" | Channels extracted"
          fi
          
          git commit -m "$commit_message"
          git push origin HEAD:${{ github.ref }}
          
          echo "已成功推送更新"
      # 第八阶段：日志和总结
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epg-comprehensive-logs-${{ github.run_number }}
          path: |
            logs/
            *.log
          retention-days: 7

      - name: Workflow Summary
        if: always()
        run: |
          echo "=== EPG 综合处理任务总结 ==="
          echo "状态: ${{ job.status }}"
          echo "执行的PHP脚本: ${{ steps.check_scripts.outputs.existing_scripts || '无' }}"
          echo "广东EPG处理: ${{ steps.guangdong_epg.outputs.guangdong_processed || '未执行' }}"
          echo "生成的XML文件: ${{ steps.check_xml.outputs.generated_xml || '无' }}"
          echo "繁简转换文件: ${{ steps.convert_chinese.outputs.converted_files || '无' }}"
          echo "频道名称提取: ${{ steps.extract_channels.outputs.channels_extracted || '未执行' }}"
          echo "查看详细日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "任务完成时间: $(date)"
